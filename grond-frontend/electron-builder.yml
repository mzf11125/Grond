appId: com.grond.app
productName: Grond
directories:
  buildResources: build
  output: release

files:
  - out

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png

mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.utilities

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
